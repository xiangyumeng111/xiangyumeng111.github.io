<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">x86-64 to RISC-V binary translation workflow</title>
  <desc id="desc">Workflow diagram: x86-64 ELF input is decoded with Capstone, rebuilt into functions and basic blocks, traversed into LLVM MachineIR, optimized by LLVM backend passes, emitted as a RISC-V .s2d ELF, then loaded by DBT on RISC-V with direct static execution or JIT fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset=".54" stop-color="#eef7f5"/>
      <stop offset="1" stop-color="#f7f4ee"/>
    </linearGradient>
    <linearGradient id="staticLane" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1faf8"/>
    </linearGradient>
    <linearGradient id="runtimeLane" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f6fbff"/>
    </linearGradient>
    <linearGradient id="blueGreen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2f6f9f"/>
      <stop offset=".56" stop-color="#2f9c88"/>
      <stop offset="1" stop-color="#ce7a35"/>
    </linearGradient>
    <filter id="softShadow" x="-14%" y="-20%" width="128%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#183241" flood-opacity=".14"/>
    </filter>
    <filter id="smallShadow" x="-18%" y="-20%" width="136%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183241" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f6f9f"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f9c88"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#ce7a35"/>
    </marker>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#b8c7ce" stroke-width="1" opacity=".18"/>
    </pattern>
    <style>
      .title { font: 760 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172b35; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #566b75; }
      .lane-title { font: 740 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #26404b; }
      .step-title { font: 730 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f3844; }
      .step-sub { font: 520 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #637985; }
      .micro { font: 560 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #657983; }
      .code { font: 650 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #28424f; }
      .code-light { font: 620 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #48616c; }
      .code-mini { font: 620 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #48616c; }
      .chip { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #31515c; }
      .lane { stroke: #d3e0e5; stroke-width: 1.6; }
      .card { fill: #ffffff; stroke: #d6e3e8; stroke-width: 1.7; }
      .static-flow { fill: none; stroke: #2f6f9f; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow); }
      .runtime-flow { fill: none; stroke: #2f9c88; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowGreen); }
      .jit-flow { fill: none; stroke: #ce7a35; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 8 10; marker-end: url(#arrowOrange); }
      .thin { fill: none; stroke: #78aebb; stroke-width: 2.1; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="34" fill="url(#grid)"/>
  <path d="M48 760C246 705 360 785 553 727C737 672 877 704 1047 751C1230 802 1400 759 1553 695" fill="none" stroke="#d2e1e6" stroke-width="2" stroke-dasharray="8 18"/>

  <text x="800" y="58" text-anchor="middle" class="title">Binary Translation Workflow</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">x86-64 static translation into RISC-V ELF .s2d, paired with DBT/JIT fallback at runtime</text>

  <g transform="translate(54 122)" filter="url(#softShadow)">
    <rect width="1492" height="452" rx="22" fill="url(#staticLane)" class="lane"/>
    <text x="28" y="38" class="lane-title">Static translator</text>
    <text x="28" y="63" class="step-sub">Recover program structure, lower x86 instructions, optimize through LLVM backend passes, and emit the static artifact.</text>
  </g>
  <g transform="translate(54 618)" filter="url(#softShadow)">
    <rect width="1492" height="214" rx="22" fill="url(#runtimeLane)" class="lane"/>
    <text x="28" y="38" class="lane-title">RISC-V runtime</text>
    <text x="28" y="63" class="step-sub">DBT loads .s2d and dispatches covered paths directly or uncovered paths to JIT.</text>
  </g>

  <path class="runtime-flow" d="M988 727H1120"/>
  <path class="runtime-flow" d="M1251 707C1310 684 1354 670 1418 678"/>
  <path class="jit-flow" d="M1251 748C1311 786 1358 796 1427 774"/>

  <g transform="translate(83 198)" filter="url(#smallShadow)">
    <rect width="176" height="298" rx="17" class="card"/>
    <text x="88" y="35" text-anchor="middle" class="step-title">x86-64</text>
    <text x="88" y="58" text-anchor="middle" class="step-sub">program input</text>
    <g transform="translate(27 86)">
      <rect width="122" height="142" rx="11" fill="#fff4e7" stroke="#ddb06f" stroke-width="1.6"/>
      <rect width="122" height="31" rx="11" fill="#e7a752"/>
      <circle cx="18" cy="16" r="4.5" fill="#fff7e8"/>
      <circle cx="34" cy="16" r="4.5" fill="#fff7e8"/>
      <circle cx="50" cy="16" r="4.5" fill="#fff7e8"/>
      <text x="17" y="61" class="code">ELF .text</text>
      <text x="17" y="88" class="code-light">48 89 e5</text>
      <text x="17" y="110" class="code-light">e8 2a 00</text>
      <text x="17" y="132" class="code-light">0f 85 c1</text>
    </g>
    <rect x="27" y="248" width="122" height="30" rx="8" fill="#f9fbfc" stroke="#d8e2e6"/>
    <text x="88" y="268" text-anchor="middle" class="micro">opaque bytes</text>
  </g>

  <g transform="translate(403 198)" filter="url(#smallShadow)">
    <rect width="176" height="298" rx="17" class="card"/>
    <text x="88" y="35" text-anchor="middle" class="step-title">Capstone</text>
    <text x="88" y="58" text-anchor="middle" class="step-sub">disassembly</text>
    <g transform="translate(27 88)">
      <rect width="122" height="154" rx="12" fill="#ffffff" stroke="#d8e3e8" stroke-width="1.6"/>
      <rect x="15" y="18" width="92" height="26" rx="8" fill="#fff4e7" stroke="#dfad69"/>
      <text x="24" y="36" class="code-light">push rbp</text>
      <rect x="15" y="52" width="92" height="26" rx="8" fill="#fff4e7" stroke="#dfad69"/>
      <text x="24" y="70" class="code-light">mov rbp,rsp</text>
      <rect x="15" y="86" width="92" height="26" rx="8" fill="#fff4e7" stroke="#dfad69"/>
      <text x="24" y="104" class="code-light">call 0x...</text>
      <rect x="15" y="120" width="92" height="26" rx="8" fill="#fff4e7" stroke="#dfad69"/>
      <text x="24" y="138" class="code-light">jne .L2</text>
    </g>
    <text x="88" y="269" text-anchor="middle" class="micro">bytes to x86 insns</text>
  </g>

  <g transform="translate(724 198)" filter="url(#smallShadow)">
    <rect width="176" height="298" rx="17" class="card"/>
    <text x="88" y="35" text-anchor="middle" class="step-title">CFG builder</text>
    <text x="88" y="58" text-anchor="middle" class="step-sub">functions and BBs</text>
    <g transform="translate(16 80)">
      <rect x="43" y="0" width="58" height="31" rx="9" fill="#eaf8f8" stroke="#48a092" stroke-width="2"/>
      <rect x="0" y="70" width="58" height="31" rx="9" fill="#eaf8f8" stroke="#48a092" stroke-width="2"/>
      <rect x="86" y="70" width="58" height="31" rx="9" fill="#eaf8f8" stroke="#48a092" stroke-width="2"/>
      <rect x="43" y="140" width="58" height="31" rx="9" fill="#eaf8f8" stroke="#48a092" stroke-width="2"/>
      <path class="thin" d="M72 31C37 45 29 53 29 70"/>
      <path class="thin" d="M72 31c35 14 43 22 43 39"/>
      <path class="thin" d="M29 101c6 25 30 33 43 39"/>
      <path class="thin" d="M115 101c-6 25-30 33-43 39"/>
      <text x="72" y="20" text-anchor="middle" class="chip">F</text>
      <text x="29" y="90" text-anchor="middle" class="chip">BB</text>
      <text x="115" y="90" text-anchor="middle" class="chip">BB</text>
      <text x="72" y="160" text-anchor="middle" class="chip">BB</text>
    </g>
    <text x="88" y="280" text-anchor="middle" class="micro">traverse function then BB</text>
  </g>

  <g transform="translate(1045 198)" filter="url(#smallShadow)">
    <rect width="176" height="298" rx="17" class="card"/>
    <text x="88" y="35" text-anchor="middle" class="step-title">MachineIR</text>
    <text x="88" y="58" text-anchor="middle" class="step-sub">RISC-V LLVM MIR</text>
    <g transform="translate(18 68)">
      <rect width="140" height="38" rx="10" fill="#fff4e7" stroke="#dfad69" stroke-width="1.6"/>
      <text x="70" y="25" text-anchor="middle" class="code-light">add v0, v1, v2</text>
      <path d="M70 47v32" stroke="#2f6f9f" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arrow)"/>
      <rect y="92" width="140" height="102" rx="12" fill="#eff8ff" stroke="#9ab7d1" stroke-width="1.6"/>
      <text x="8" y="119" class="code-mini">%v0:VR=COPY %a0:GPR</text>
      <text x="8" y="145" class="code-mini">%v1:VR=ADD %v0,%v2</text>
      <text x="8" y="171" class="code-mini">%v2:VR=SLLI %v1,2</text>
    </g>
    <text x="88" y="276" text-anchor="middle" class="micro">one-to-many lowering</text>
  </g>

  <g transform="translate(1366 198)" filter="url(#smallShadow)">
    <rect width="150" height="298" rx="17" class="card"/>
    <text x="75" y="35" text-anchor="middle" class="step-title">LLVM</text>
    <text x="75" y="58" text-anchor="middle" class="step-sub">backend pipeline</text>
    <g transform="translate(18 83)">
      <rect width="114" height="26" rx="8" fill="#ecf8f4" stroke="#75b49b" stroke-width="1.5"/>
      <text x="57" y="18" text-anchor="middle" class="micro">RegAlloc</text>
      <rect y="35" width="114" height="26" rx="8" fill="#ecf8f4" stroke="#75b49b" stroke-width="1.5"/>
      <text x="57" y="53" text-anchor="middle" class="micro">DCE</text>
      <rect y="70" width="114" height="26" rx="8" fill="#ecf8f4" stroke="#75b49b" stroke-width="1.5"/>
      <text x="57" y="88" text-anchor="middle" class="micro">BranchFolder</text>
      <rect y="105" width="114" height="26" rx="8" fill="#ecf8f4" stroke="#75b49b" stroke-width="1.5"/>
      <text x="57" y="123" text-anchor="middle" class="micro">BranchReorder</text>
      <rect y="152" width="114" height="54" rx="11" fill="#f4fbfc" stroke="#a9c9d5" stroke-width="1.5"/>
      <text x="57" y="175" text-anchor="middle" class="code-light">RISC-V</text>
      <text x="57" y="195" text-anchor="middle" class="code-light">emit ELF</text>
    </g>
  </g>

  <!-- Card-to-card arrows stay above the panels so their shafts remain visible. -->
  <path class="static-flow" d="M270 347H391"/>
  <path class="static-flow" d="M590 347H712"/>
  <path class="static-flow" d="M911 347H1033"/>
  <path class="static-flow" d="M1232 347H1354"/>

  <g transform="translate(662 653)" filter="url(#smallShadow)">
    <rect width="326" height="132" rx="18" fill="#eef9fb" stroke="#3a80a3" stroke-width="2.3"/>
    <text x="163" y="27" text-anchor="middle" class="step-title">static translation result</text>
    <g transform="translate(30 48)">
      <rect width="88" height="54" rx="10" fill="#ffffff" stroke="#9cc4d2" stroke-width="1.4"/>
      <path d="M17 17h37M17 30h54M17 43h42" stroke="#4f98ac" stroke-width="6" stroke-linecap="round"/>
      <text x="112" y="17" class="code">program.s2d</text>
      <text x="112" y="38" class="step-sub">RISC-V ELF</text>
      <text x="112" y="58" class="step-sub">optimized static output</text>
    </g>
  </g>
  <path class="static-flow" d="M1441 496C1428 568 1174 614 890 646"/>

  <g transform="translate(1120 651)" filter="url(#smallShadow)">
    <rect width="132" height="153" rx="17" class="card"/>
    <text x="66" y="32" text-anchor="middle" class="step-title">DBT</text>
    <text x="66" y="54" text-anchor="middle" class="step-sub">loader</text>
    <g transform="translate(28 68)">
      <path d="M38 0 76 38 38 76 0 38z" fill="#eef8f5" stroke="#58a98f" stroke-width="2"/>
      <text x="38" y="34" text-anchor="middle" class="micro">covered</text>
      <text x="38" y="51" text-anchor="middle" class="micro">?</text>
    </g>
  </g>

  <g transform="translate(1418 627)" filter="url(#smallShadow)">
    <rect width="100" height="82" rx="15" fill="#eaf8f4" stroke="#4ea18b" stroke-width="2"/>
    <path d="M34 22h32M34 35h32M34 48h22" stroke="#2f9c88" stroke-width="5" stroke-linecap="round"/>
    <text x="50" y="72" text-anchor="middle" class="micro">run .s2d directly</text>
  </g>

  <g transform="translate(1418 743)" filter="url(#smallShadow)">
    <rect width="100" height="62" rx="15" fill="#fff4e6" stroke="#ce7a35" stroke-width="2"/>
    <path d="M34 20l32 11-32 11z" fill="#ce7a35"/>
    <text x="50" y="56" text-anchor="middle" class="micro">dynamic JIT</text>
  </g>

  <g transform="translate(103 524)">
    <rect width="456" height="34" rx="17" fill="#ffffff" stroke="#d6e3e8" stroke-width="1.4" opacity=".96"/>
    <circle cx="22" cy="17" r="5" fill="#2f6f9f"/>
    <text x="38" y="22" class="micro">solid path: static analysis and LLVM backend emission</text>
  </g>
  <g transform="translate(1120 820)">
    <rect width="396" height="34" rx="17" fill="#ffffff" stroke="#d6e3e8" stroke-width="1.4" opacity=".96"/>
    <circle cx="22" cy="17" r="5" fill="#2f9c88"/>
    <text x="38" y="22" class="micro">covered code: optimized .s2d</text>
    <circle cx="224" cy="17" r="5" fill="#ce7a35"/>
    <text x="240" y="22" class="micro">uncovered code: JIT</text>
  </g>
</svg>
